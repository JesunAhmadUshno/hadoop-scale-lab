[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hadoop-scale-lab"
version = "0.1.0"
description = "Pre-registered scale study: Hadoop MapReduce on HDFS vs a tuned single-node baseline for document analytics."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["common", "build_corpus", "baseline"]
