name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Compile all study code
        run: |
          python -m py_compile src/*.py jobs/*.py scripts/*.py spark/*.py
      - name: Results regenerate unchanged from the evidence
        run: python scripts/make_results.py && git diff --exit-code RESULTS.md
      - name: Validate compose file
        run: docker compose config -q
